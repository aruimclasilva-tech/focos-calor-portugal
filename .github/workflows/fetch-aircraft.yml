name: Fetch aircraft positions

# Workflow dedicado às posições de aeronaves (ADS-B), separado do fetch do
# MTG para poder correr com uma cadência mais curta sem alterar o ritmo dos
# focos de calor (que continuam nos ~10 min via cron-job.org / fetch-fires.yml).
on:
  workflow_dispatch: {}
  # 5 minutos é o intervalo mínimo prático que o agendamento nativo do
  # GitHub trata com fiabilidade razoável (pode atrasar-se um pouco em
  # repositórios com pouca atividade, mas não some horas como acontecia
  # com o disparo externo a cada 10-15 min só para o MTG).
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: fetch-aircraft-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Descarregar posições de aeronaves (ADS-B)
        run: python aircraft_fetch.py --outdir docs

      # Publica com nova(s) tentativa(s) em caso de conflito — este workflow
      # corre a cada minuto e pode ocasionalmente coincidir com um push do
      # workflow do MTG (fetch-fires.yml) no mesmo branch. Em vez de falhar
      # logo à primeira, volta a sincronizar (git pull --rebase) e tenta
      # outra vez, até a alguma tentativa ter sucesso.
      - name: Publicar resultado no repositório (com nova tentativa em caso de conflito)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # "git diff --quiet" só vê ficheiros já controlados pelo git — na
          # primeira vez que aircraft_trails.json for criado ainda está por
          # adicionar, por isso usa-se "git status --porcelain" (apanha
          # também novos ficheiros) em vez de "git diff".
          if [ -z "$(git status --porcelain -- docs/portugal_aircraft.json docs/aircraft_trails.json)" ]; then
            echo "Sem alterações para publicar."
            exit 0
          fi

          git add docs/portugal_aircraft.json docs/aircraft_trails.json
          git commit -m "Atualiza posições de aeronaves (ADS-B) e trajetos Heli INEM"

          for i in 1 2 3 4 5 6; do
            if git push origin main; then
              echo "Publicado (tentativa $i)."
              exit 0
            fi
            echo "Push falhou (tentativa $i) — provavelmente conflito com outro workflow. A sincronizar e a tentar de novo..."
            sleep $(( (RANDOM % 5) + 2 ))
            git pull --rebase origin main
          done

          echo "Não foi possível publicar depois de várias tentativas." >&2
          exit 1
