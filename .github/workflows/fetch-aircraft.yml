name: Fetch aircraft positions

# Workflow dedicado às posições de aeronaves (ADS-B), separado do fetch do
# MTG para poder correr com uma cadência mais curta sem alterar o ritmo dos
# focos de calor (que continuam nos ~10 min via cron-job.org / fetch-fires.yml).
on:
  workflow_dispatch: {}
  # 5 minutos é o intervalo mínimo prático que o agendamento nativo do
  # GitHub trata com fiabilidade razoável (pode atrasar-se um pouco em
  # repositórios com pouca atividade, mas não some horas como acontecia
  # com o disparo externo a cada 10-15 min só para o MTG).
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: fetch-aircraft-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Descarregar posições de aeronaves (ADS-B)
        run: python aircraft_fetch.py --outdir docs

      # Publica com nova(s) tentativa(s) em caso de conflito — este workflow
      # corre a cada minuto e pode ocasionalmente coincidir com um push do
      # workflow do MTG (fetch-fires.yml) no mesmo branch. Em vez de falhar
      # logo à primeira, volta a sincronizar (git pull --rebase) e tenta
      # outra vez, até a alguma tentativa ter sucesso.
      - name: Publicar resultado no repositório (com nova tentativa em caso de conflito)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # "git diff --quiet" só vê ficheiros já controlados pelo git — na
          # primeira vez que aircraft_trails.json/aircraft_last_seen.json
          # forem criados ainda estão por adicionar, por isso usa-se
          # "git status --porcelain" (apanha também novos ficheiros) em vez
          # de "git diff".
          if [ -z "$(git status --porcelain -- docs/portugal_aircraft.json docs/aircraft_trails.json docs/aircraft_last_seen.json)" ]; then
            echo "Sem alterações para publicar."
            exit 0
          fi

          # Guarda à parte o conteúdo gerado agora, para poder reaplicá-lo
          # tal e qual a cada tentativa, depois de alinhar tudo o resto com
          # o origin/main mais recente (ver nota abaixo sobre porquê).
          mkdir -p /tmp/aircraft-out
          cp docs/portugal_aircraft.json docs/aircraft_trails.json docs/aircraft_last_seen.json /tmp/aircraft-out/

          MSG="Atualiza posições de aeronaves (ADS-B), trajetos e última posição conhecida Heli INEM"
          git add docs/portugal_aircraft.json docs/aircraft_trails.json docs/aircraft_last_seen.json
          git commit -m "$MSG"

          for i in 1 2 3 4 5 6; do
            if git push origin main; then
              echo "Publicado (tentativa $i)."
              exit 0
            fi
            echo "Push falhou (tentativa $i) — provavelmente outra execução publicou entretanto. A sincronizar e a tentar de novo..."
            sleep $(( (RANDOM % 5) + 2 ))
            git fetch origin main
            # IMPORTANTE: "git reset --soft origin/main" sozinho move o
            # HEAD mas deixa o índice tal como estava no checkout inicial
            # do job — ou seja, para QUALQUER ficheiro que outra pessoa
            # tenha entretanto alterado e publicado em origin/main nesse
            # intervalo (ex.: a própria página HTML, editada manualmente),
            # o commit seguinte reintroduzia a versão antiga desse
            # ficheiro por cima da nova, revertendo-a silenciosamente —
            # foi o que aconteceu a uma correção da página feita durante
            # este tipo de conflito. Por isso alinha-se primeiro TUDO com
            # o novo origin/main (checkout -- .) e só depois se voltam a
            # aplicar por cima, deliberadamente, só os três ficheiros que
            # este workflow gera.
            git reset --soft origin/main
            git checkout origin/main -- .
            cp /tmp/aircraft-out/portugal_aircraft.json docs/portugal_aircraft.json
            cp /tmp/aircraft-out/aircraft_trails.json docs/aircraft_trails.json
            cp /tmp/aircraft-out/aircraft_last_seen.json docs/aircraft_last_seen.json
            git add docs/portugal_aircraft.json docs/aircraft_trails.json docs/aircraft_last_seen.json
            git commit -m "$MSG"
          done

          echo "Não foi possível publicar depois de várias tentativas." >&2
          exit 1
