name: Fetch MTG fire data

on:
  # Disparo principal: externo (ver cron-job.org) via workflow_dispatch,
  # com precisão ao minuto.
  workflow_dispatch: {}
  # Rede de segurança: agendamento nativo do GitHub. É "best effort" e pode
  # atrasar-se (o GitHub não garante o intervalo exato em repositórios com
  # pouca atividade), mas garante que, mesmo que o cron-job.org falhe ou
  # pare de disparar durante horas, o fetch continua a correr no máximo com
  # este intervalo.
  schedule:
    - cron: '*/15 * * * *'

# Impede que duas execuções corram ao mesmo tempo (evita conflitos de git push
# quando dois disparos acontecem muito próximos um do outro).
concurrency:
  group: fetch-mtg-fire-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Descarregar e processar dados MTG
        run: python mtg_fire_fetch.py --outdir docs
        env:
          LSASAF_USER: ${{ secrets.LSASAF_USER }}
          LSASAF_PASS: ${{ secrets.LSASAF_PASS }}

      # Publica com nova(s) tentativa(s) em caso de conflito. O workflow das
      # aeronaves (fetch-aircraft.yml) corre a cada minuto e publica no mesmo
      # branch — por vezes o push deste workflow chega mesmo depois de um
      # push das aeronaves, e é rejeitado (não é "fast-forward"). Em vez de
      # falhar logo à primeira, volta a sincronizar (git pull --rebase) e
      # tenta outra vez, até a alguma tentativa ter sucesso.
      - name: Publicar resultado no repositório (com nova tentativa em caso de conflito)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- docs/portugal_fires_mtg.json docs/portugal_fires_mtg_history.json; then
            echo "Sem alterações para publicar."
            exit 0
          fi

          git add docs/portugal_fires_mtg.json docs/portugal_fires_mtg_history.json
          git commit -m "Atualiza focos de calor MTG"

          for i in 1 2 3 4 5 6; do
            if git push origin main; then
              echo "Publicado (tentativa $i)."
              exit 0
            fi
            echo "Push falhou (tentativa $i) — provavelmente conflito com outro workflow. A sincronizar e a tentar de novo..."
            sleep $(( (RANDOM % 5) + 2 ))
            git pull --rebase origin main
          done

          echo "Não foi possível publicar depois de várias tentativas." >&2
          exit 1
