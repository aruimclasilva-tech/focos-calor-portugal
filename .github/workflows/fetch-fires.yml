name: Fetch MTG fire data

on:
  # Disparo principal: externo (ver cron-job.org) via workflow_dispatch,
  # com precisão ao minuto.
  workflow_dispatch: {}
  # Rede de segurança: agendamento nativo do GitHub. É "best effort" e pode
  # atrasar-se (o GitHub não garante o intervalo exato em repositórios com
  # pouca atividade), mas garante que, mesmo que o cron-job.org falhe ou
  # pare de disparar durante horas, o fetch continua a correr no máximo com
  # este intervalo.
  schedule:
    - cron: '*/15 * * * *'

# Impede que duas execuções corram ao mesmo tempo (evita conflitos de git push
# quando dois disparos acontecem muito próximos um do outro).
concurrency:
  group: fetch-mtg-fire-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: pip install requests

      - name: Descarregar e processar dados MTG
        run: python mtg_fire_fetch.py --outdir docs
        env:
          LSASAF_USER: ${{ secrets.LSASAF_USER }}
          LSASAF_PASS: ${{ secrets.LSASAF_PASS }}

      - name: Descarregar posições de aeronaves (ADS-B)
        run: python aircraft_fetch.py --outdir docs
        continue-on-error: true  # nunca deve impedir a atualização dos focos de calor

      - name: Sincronizar com o repositório remoto (rede de segurança)
        run: git pull --rebase origin main || true

      - name: Publicar resultado no repositório
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza focos de calor MTG e posições ADS-B"
          file_pattern: docs/portugal_fires_mtg.json docs/portugal_fires_mtg_history.json docs/portugal_aircraft.json
